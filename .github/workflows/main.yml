name: Pemicu Autopilot Saham

on:
  schedule:
    - cron: '15 09 * * *'
  workflow_dispatch:

jobs:
  buka-website:
    runs-on: ubuntu-latest
    steps:
      - name: Install Puppeteer (Headless Chrome)
        run: npm i puppeteer
        
      - name: Eksekusi URL Tembus Keamanan InfinityFree
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            console.log('Membuka browser...');
            const browser = await puppeteer.launch({args: ['--no-sandbox']});
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36');
            
            console.log('Mengunjungi master_auto.php...');
            await page.goto('https://saham.xo.je/master_auto.php', {waitUntil: 'networkidle2', timeout: 60000});
            
            console.log('⏳ Menunggu 30 detik agar mesin PHP di server leluasa berhitung & mengirim Telegram...');
            await new Promise(r => setTimeout(r, 30000));
            
            console.log('✅ Sukses tereksekusi!');
            await browser.close();
          })();
          "
