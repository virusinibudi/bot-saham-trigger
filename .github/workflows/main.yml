name: Pemicu Autopilot Saham

on:
  schedule:
   # Tes eksekusi jam 18:25 WIB (11:25 UTC)
    - cron: '25 11 * * *'
  workflow_dispatch:

jobs:
  buka-website:
    runs-on: ubuntu-latest
    steps:
      - name: Install Stealth Puppeteer (Mode Ninja)
        run: npm i puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
        
      - name: Eksekusi URL Tembus Keamanan InfinityFree
        run: |
          node -e "
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());

          (async () => {
            console.log('Membuka browser Ninja...');
            const browser = await puppeteer.launch({args: ['--no-sandbox']});
            const page = await browser.newPage();
            
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36');
            
            console.log('Mengunjungi URL master_auto.php...');
            await page.goto('https://saham.xo.je/master_auto.php');
            
            console.log('⏳ Menunggu 60 detik agar mesin PHP tereksekusi penuh...');
            await new Promise(r => setTimeout(r, 60000));
            
            console.log('✅ Waktu tunggu selesai!');
            await browser.close();
          })();
          "
